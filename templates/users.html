{% extends 'base.html' %}{% block headline %}Usuários e perfis{% endblock %}{% block content %}<div class="page-intro"><div><h2>Gestão de acessos</h2><p>Disponível apenas ao administrador.</p></div></div><div class="two-cols"><section class="panel"><h3>Adicionar usuário</h3><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Nome<input name="name" required minlength="2" maxlength="100"></label><label>E-mail<input name="email" type="email" required></label><label>Senha inicial (mínimo de 10 caracteres)<input name="password" type="password" minlength="10" required></label><label>Perfil<select name="role">{% for r in roles %}<option value="{{r}}">{{r|capitalize}}</option>{% endfor %}</select></label><button class="btn primary" type="submit">Cadastrar usuário</button></form></section><section class="panel"><h3>Usuários cadastrados</h3>{% for u in users %}<div class="user-row"><div><b>{{u.name}}</b><small>{{u.email}}</small></div><span class="pill">{{u.role}}</span></div>{% endfor %}</section></div>{% endblock %}
